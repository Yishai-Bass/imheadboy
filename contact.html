<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - ImHeadBoy Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .wrapper {
      position: relative;
      min-height: 100vh;
      background: url('image.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,0.7);
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background: rgba(85,85,85,0.8);
    }
    .navbar-brand {
      font-weight: bold;
    }
    .content {
      flex: 1;
      padding: 2rem 0;
      position: relative;
      z-index: 1;
    }
    .footer {
      background: rgba(51,51,51,0.8);
      color: #fff;
      padding: 20px 0;
      text-align: center;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="overlay">
      <!-- Navigation -->
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="index.html">ImHeadBoy Store</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="index.html">Shop</a></li>
              <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
              <li class="nav-item"><a class="nav-link active" href="content.html">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
      <!-- Content -->
      <div class="content container">
        <h1>Contact Us</h1>
        <form action="https://formspree.io/f/maneyele?_next=https://www.imheadboy.com/index.html" method="POST">
          <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" name="name" id="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" name="email" id="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message:</label>
            <textarea name="message" id="message" rows="5" class="form-control" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>
      <!-- Sticky Footer -->
      <div class="footer">
        <div class="container">
          <p>&copy; 2025 ImHeadBoy Store. All Rights Reserved.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
